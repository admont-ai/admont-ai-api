services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: admont-ai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: admont-ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/pgvector/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d admont-ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  languagetool:
    image: erikvl87/languagetool
    container_name: admont-ai-languagetool
    ports:
      - "8082:8010"
    environment:
      Java_Xms: 512m
      Java_Xmx: 1g
    restart: unless-stopped

volumes:
  pgdata:
