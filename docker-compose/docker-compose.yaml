services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: admont-ai-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admont-ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/pgvector/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admont-ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  hydra:
    image: oryd/hydra:v2.3.0
    container_name: admont-ai-hydra
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://admin:admin@postgres:5432/admont-ai?sslmode=disable&search_path=hydra
      URLS_SELF_ISSUER: http://localhost:4444
      URLS_LOGIN: http://localhost:8080/hydra/login
      URLS_CONSENT: http://localhost:8080/hydra/consent
      URLS_LOGOUT: http://localhost:8080/hydra/logout
      SECRETS_SYSTEM: a-very-secret-key-that-must-be-at-least-32-chars
      SERVE_PUBLIC_CORS_ENABLED: "true"
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: http://localhost:5173
      SERVE_ADMIN_CORS_ENABLED: "true"
      LOG_LEVEL: info
    ports:
      - "4444:4444"
      - "4445:4445"
    entrypoint: ["sh", "-c", "hydra migrate sql -e --yes && hydra serve all --dev"]
    restart: unless-stopped

  languagetool:
    image: erikvl87/languagetool
    container_name: admont-ai-languagetool
    ports:
      - "8081:8010"
    environment:
      Java_Xms: 512m
      Java_Xmx: 1g
    restart: unless-stopped

volumes:
  pgdata:
